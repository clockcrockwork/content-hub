name: ブログデプロイ
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'astro.config.*', 'package.json']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Node.js セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存インストール & ビルド
        run: |
          npm ci
          npm run build

      - name: Cloudflare Pagesにデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=content-hub
